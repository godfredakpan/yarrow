<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon – Yarrow</title>
    <meta name="description" content="Yarrow is coming soon. Women's health programmes and care at every stage of life. We haven't launched yet—stay tuned." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#86A03B" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f5f7f0 0%, #e8ecd8 50%, #dce2c8 100%);
        color: #2c2c2c;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 420px;
        padding: 2.5rem 2rem;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(134, 160, 59, 0.12), 0 1px 3px rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(134, 160, 59, 0.2);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        background: #86A03B;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 0.5rem;
      }
      .brand {
        font-size: 0.95rem;
        color: #86A03B;
        font-weight: 600;
        margin-bottom: 1rem;
      }
      p {
        font-size: 0.95rem;
        line-height: 1.6;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">&#127800;</div>
      <h1>Coming soon</h1>
      <p class="brand">Yarrow</p>
      <p>We haven't launched yet. Women's health at every stage of life—we'll be here soon.</p>
    </div>
  </body>
</html>
